<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekaidan — Music Library</title>
<link rel="stylesheet" href="style.css">
<style>
.lib-header { padding:28px 28px 0; max-width:960px; margin:0 auto }
.lib-title  { font-size:28px; font-weight:900; letter-spacing:-1px; margin-bottom:6px }
.lib-sub    { font-size:14px; color:var(--txt2); margin-bottom:24px }

.lib-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px }
.filter-chip {
  padding:7px 16px; border-radius:100px;
  background:var(--bg2); border:0.5px solid var(--border2);
  font-size:13px; font-weight:600; cursor:pointer; color:var(--txt2);
  transition:all 0.15s;
}
.filter-chip.active,.filter-chip:hover { background:var(--yellow); color:#000; border-color:var(--yellow) }

.lib-search { position:relative; max-width:320px; margin-bottom:28px }
.lib-search input {
  width:100%; padding:10px 14px 10px 36px;
  background:var(--bg2); border:0.5px solid var(--border2);
  border-radius:100px; font-size:13px; color:var(--txt);
  outline:none; transition:border-color 0.2s;
  font-family:'Space Grotesk',sans-serif;
}
.lib-search input:focus { border-color:var(--yellow) }
.lib-search input::placeholder { color:var(--txt3) }
.lib-search::before {
  content:'🔍'; position:absolute; left:12px; top:50%;
  transform:translateY(-50%); font-size:13px; pointer-events:none;
}

.songs-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
  gap:14px;
  padding:0 28px 60px;
  max-width:960px; margin:0 auto;
}

/* Song card */
.song-card {
  background:var(--bg2); border:0.5px solid var(--border2);
  border-radius:14px; overflow:hidden; cursor:pointer;
  transition:border-color 0.2s, transform 0.18s;
  position:relative;
}
.song-card:hover { border-color:rgba(245,197,24,0.55); transform:translateY(-4px) }

.song-thumb {
  width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--bg3);
  display:block;
}
.song-thumb-placeholder {
  width:100%; aspect-ratio:16/9; background:var(--bg3);
  display:flex; align-items:center; justify-content:center; font-size:36px;
}

/* Play overlay */
.song-play-overlay {
  position:absolute; top:0; left:0;
  width:100%; aspect-ratio:16/9;
  background:rgba(0,0,0,0.45);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.18s;
}
.song-card:hover .song-play-overlay { opacity:1 }
.play-circle-big {
  width:52px; height:52px; border-radius:50%;
  background:var(--yellow); color:#000;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}

.song-info { padding:12px 14px }
.song-title {
  font-size:14px; font-weight:700; margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.song-artist { font-size:12px; color:var(--txt2); margin-bottom:8px }
.song-meta { display:flex; align-items:center; justify-content:space-between }
.song-diff {
  font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px;
}
.diff-beginner     { background:rgba(34,217,138,0.15); color:var(--green) }
.diff-intermediate { background:rgba(245,197,24,0.15);  color:var(--yellow) }
.diff-advanced     { background:rgba(255,92,92,0.15);   color:var(--red) }
.song-xp { font-size:11px; color:var(--yellow); font-weight:700 }

/* Karaoke badge */
.song-kr-badge {
  position:absolute; top:8px; right:8px;
  background:rgba(245,197,24,0.9); color:#000;
  font-size:9px; font-weight:800; padding:3px 8px;
  border-radius:100px; letter-spacing:0.5px;
}

.empty-msg { grid-column:1/-1; text-align:center; padding:48px; color:var(--txt3); font-size:14px }

/* Loading skeleton */
.skeleton {
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
@keyframes shimmer { to { background-position:-200% 0 } }
.sk-card { border-radius:14px; overflow:hidden; border:0.5px solid var(--border) }
.sk-thumb { width:100%; aspect-ratio:16/9 }
.sk-body { padding:12px 14px }
.sk-line { height:14px; margin-bottom:8px; border-radius:4px }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <a href="index.html" style="text-decoration:none;color:inherit">E<span>kaidan</span></a>
  </div>
  <div id="user-bar-nav" style="display:flex;align-items:center;gap:10px"></div>
  <a href="index.html" style="text-decoration:none">
    <button class="nav-btn">← Home</button>
  </a>
</nav>

<div class="lib-header">
  <h1 class="lib-title">🎵 Music Library</h1>
  <p class="lib-sub" id="lib-sub">All songs available for study</p>

  <div class="lib-filters">
    <div class="filter-chip active" data-filter="">All</div>
    <div class="filter-chip" data-filter="Beginner">Beginner</div>
    <div class="filter-chip" data-filter="Intermediate">Intermediate</div>
    <div class="filter-chip" data-filter="Advanced">Advanced</div>
  </div>

  <div class="lib-search">
    <input type="text" id="lib-search-input" placeholder="Search songs or artists…" oninput="renderGrid()">
  </div>
</div>

<div class="songs-grid" id="songs-grid">
  <!-- Loading skeletons -->
  ${Array(6).fill(`
    <div class="sk-card">
      <div class="sk-thumb skeleton"></div>
      <div class="sk-body">
        <div class="sk-line skeleton" style="width:80%"></div>
        <div class="sk-line skeleton" style="width:55%"></div>
      </div>
    </div>`).join('')}
</div>

<script src="site_js_final.js"></script>
<script>
// ── AUTH GUARD ──
if (!AUTH.requireAuth(location.href)) { /* redirected */ }

// ── NAV USER INFO ──
const profile = AUTH.currentProfile();
if (profile) {
  const pct = Math.min(((profile.xp || 0) % 500) / 5, 100);
  document.getElementById('user-bar-nav').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;background:var(--bg3);padding:6px 12px;border-radius:100px;border:0.5px solid var(--border2)">
      <span style="font-size:12px;color:var(--yellow);font-weight:700">Lv ${profile.level||1}</span>
      <div style="width:60px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--yellow);border-radius:2px"></div>
      </div>
      <span style="font-size:11px;color:var(--txt2)">${(profile.xp||0).toLocaleString()} XP</span>
    </div>
    <span style="font-size:13px;font-weight:700;color:var(--txt)">${profile.username}</span>`;
}

// ── SONGS STATE ──
let songs        = [];
let activeFilter = '';

async function loadSongs() {
  try {
    const all = await DB.getLiveSongs();
    songs = all;
    const sub = document.getElementById('lib-sub');
    if (sub) sub.textContent = profile
      ? `Welcome back, ${profile.username}! ${songs.length} songs ready to study.`
      : `${songs.length} songs available for study.`;
    renderGrid();
  } catch (e) {
    document.getElementById('songs-grid').innerHTML =
      '<div class="empty-msg">Could not load songs. Please try again.</div>';
  }
}

function renderGrid() {
  const grid = document.getElementById('songs-grid');
  const q    = document.getElementById('lib-search-input').value.toLowerCase().trim();

  const filtered = songs.filter(s => {
    const lvl  = s.difficulty || s.level || '';
    const ok   = !activeFilter || lvl === activeFilter;
    const oks  = !q || s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q);
    return ok && oks;
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-msg">No songs found. Try a different filter or search.</div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(song => {
    const lvl       = song.difficulty || song.level || '';
    const diffClass = lvl === 'Beginner' ? 'diff-beginner'
                    : lvl === 'Intermediate' ? 'diff-intermediate'
                    : lvl === 'Advanced' ? 'diff-advanced' : '';
    const hasKaraoke = (song.timestamps && song.timestamps.length) || (song.lyrics && song.lyrics.length);
    const thumb  = song.youtube_id
      ? `<img class="song-thumb" src="https://img.youtube.com/vi/${song.youtube_id}/mqdefault.jpg" loading="lazy" alt="${song.title}">`
      : `<div class="song-thumb-placeholder">🎵</div>`;

    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML = `
      <div style="position:relative">
        ${thumb}
        <div class="song-play-overlay"><div class="play-circle-big">▶</div></div>
        ${hasKaraoke ? '<div class="song-kr-badge">🎤 KARAOKE</div>' : ''}
      </div>
      <div class="song-info">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist || '—'}</div>
        <div class="song-meta">
          <span class="song-diff ${diffClass}">${lvl || 'Any'}</span>
          <span class="song-xp">+${song.xp || 0} XP</span>
        </div>
      </div>`;

    card.onclick = () => {
      // Always go to the karaoke study page
      window.location.href = `karaoke.html?id=${song.id}`;
    };

    grid.appendChild(card);
  });
}

// ── FILTER CHIPS ──
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', function () {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.filter;
    renderGrid();
  });
});

loadSongs();
</script>
</body>
</html>
